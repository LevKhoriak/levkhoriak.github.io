# Quarto project for the notes. The homepage (index.html) is hand-written and not rendered by Quarto.
# Build everything with: python scripts/build.py   (see README.md)
project:
  type: default
  output-dir: _site
  render:
    - notes/*/index.qmd

execute:
  echo: false
  freeze: auto

bibliography: references.bib
csl: notes/_theme/ieee.csl

format:
  html:
    theme:
      light: [cosmo, notes/_theme/theme-light.scss]
      dark: [darkly, notes/_theme/theme-dark.scss]
    respect-user-color-scheme: true
    highlight-style: a11y
    css: shared.css
    include-in-header: notes/_theme/_note-head.html
    include-after-body: notes/_theme/_note-scripts.html
    template-partials:
      - notes/_theme/_partials/title-block.html
    toc: true
    toc-location: left
    toc-title: Contents
    toc-depth: 3
    number-sections: false
    html-math-method: katex
    code-copy: true
    lightbox: true
    crossrefs-hover: true
    citations-hover: true
    footnotes-hover: true
    reference-location: margin
    citation-location: document
    fig-cap-location: bottom
    fig-width: 6
    fig-height: 3.2
    fig-dpi: 200
    fig-format: png
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: false
    appendix-style: default
    grid:
      body-width: 760px
      margin-width: 280px
      sidebar-width: 220px
